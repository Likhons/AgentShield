  <script>
    const tl = gsap.timeline({ paused: true });
    // Only the first tween of a target+property sets its start state at load; later ones wait for their time
    // (fromTo renders its "from" immediately by default, which would show a later state on frame 0).
    const _seen = new Set();
    const ft = (t, from, to, pos) => {
      const keys = [].concat(t).flatMap(x => Object.keys(to).filter(k => !["duration", "ease"].includes(k)).map(k => x + ":" + k));
      if (keys.some(k => _seen.has(k))) to.immediateRender = false;
      keys.forEach(k => _seen.add(k));
      return tl.fromTo(t, from, to, pos);
    };
    const P = 8.7; // problem narration starts here (word times below are its clip times + P)
    const dim = ["#mail-l1", "#mail-l2", "#mail-l3", "#mail-l5"];

    // COLD OPEN (narration starts at 0.5; word times = clip time + 0.5)
    // the alert lands with a double buzz

    const shake = [-9, 9, -7, 0, -6, 6, 0];
    shake.forEach((x, i) => ft("#cold-card", { x: i ? shake[i - 1] : 0 }, { x, duration: 0.06, ease: "none" }, 0.3 + i * 0.06));
    // "...taka": the balance drops
    ft("#cold-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.inOut" }, 1.95);
    ft("#cold-new", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 2.1);

    ft("#cold-card", { borderColor: "rgba(160,140,255,0.22)" }, { borderColor: "rgba(240,68,82,0.6)", duration: 0.2, ease: "power2.out" }, 2.76);
    // "your AI agent": who did it
    ft("#cold-chip", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 3.97);
    // "paid a bill": rewind into the bill that started it
    ft("#cold", { opacity: 1, scale: 1, filter: "blur(0px)" }, { opacity: 0, scale: 1.12, filter: "blur(18px)", duration: 0.38, ease: "power2.in" }, 5.12);
    ft("#mail-win", { opacity: 0, scale: 1.1, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 5.35);
    ft("#mail-earlier", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 5.55);
    ft("#mail-earlier", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, P + 0.2);
    // "never real": the payee number and the sender are marked
    ft("#mail-num", { backgroundSize: "0% 4px", color: "#111827" },
      { backgroundSize: "100% 4px", color: "#F04452", duration: 0.4, ease: "power2.out" }, 6.53);
    ft("#mail-from", { color: "#6B7280", backgroundColor: "rgba(240,68,82,0)" }, { color: "#B91C1C", backgroundColor: "rgba(240,68,82,0.10)", duration: 0.3, ease: "power2.out" }, 6.9);

    // S3: the agent reads; the camera pushes into the email body

    ["#mail-l1", "#mail-l2", "#mail-l3", "#mail-l4", "#mail-l5"].forEach((id, i) => {
      const t = P + 1.3 + i * 1.15;
      ft(id, { backgroundColor: "rgba(113,56,255,0)" }, { backgroundColor: "rgba(113,56,255,0.16)", duration: 0.25, ease: "power2.out" }, t);
      ft(id, { backgroundColor: "rgba(113,56,255,0.16)" }, { backgroundColor: "rgba(113,56,255,0)", duration: 0.35, ease: "power2.in" }, t + 1.0);
    });
    // "attacker planted": the number lifts, everything else steps back
    ft("#mail-num", { scale: 1, backgroundColor: "rgba(240,68,82,0)" },
      { scale: 1.14, backgroundColor: "rgba(240,68,82,0.12)", duration: 0.3, ease: "power3.out" }, P + 8.65);
    ft(dim, { opacity: 1 }, { opacity: 0.35, duration: 0.4, ease: "power2.out" }, P + 9.2);

    // "Bangla or Banglish": pull back, the Bangla bill and the Banglish rent subject both show
