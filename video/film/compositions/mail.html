  <script>
    const tl = gsap.timeline({ paused: true });
    // Only the first tween of a target+property sets its start state at load; later ones wait for their time
    // (fromTo renders its "from" immediately by default, which would show a later state on frame 0).
    const _seen = new Set();
    const ft = (t, from, to, pos) => {
      const keys = [].concat(t).flatMap(x => Object.keys(to).filter(k => !["duration", "ease"].includes(k)).map(k => x + ":" + k));
      if (keys.some(k => _seen.has(k))) to.immediateRender = false;
      keys.forEach(k => _seen.add(k));
      return tl.fromTo(t, from, to, pos);
    };
    const P = 8.7; // problem narration starts here (word times below are its clip times + P)
    const dim = ["#mail-l1", "#mail-l2", "#mail-l3", "#mail-l5"];

    // S1: two bills arrive. Rent is already there on frame 0; the fake bill lands on "pay"
    ft("#mail-n-rent", { scale: 0.97 }, { scale: 1, duration: 0.6, ease: "power3.out" }, 0);
    ft("#mail-n-fake", { y: -520 }, { y: 0, duration: 0.6, ease: "power3.out" }, 1.95);
    ft("#mail-n-rent", { y: 0, scale: 1, opacity: 1 }, { y: 178, scale: 0.97, opacity: 0.75, duration: 0.6, ease: "power3.out" }, 1.95);

    // T1: the fake bill becomes the mail client
    ft("#mail-win", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 3.55);
    ft("#mail-win", { clipPath: "inset(250px 270px 520px 270px round 18px)" },
      { clipPath: "inset(0px 0px 0px 0px round 22px)", duration: 0.65, ease: "power2.inOut" }, 3.55);
    ft("#mail-n-fake", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power2.in" }, 3.6);
    ft("#mail-n-rent", { opacity: 0.75, filter: "blur(0px)" }, { opacity: 0, filter: "blur(14px)", duration: 0.3, ease: "power2.in" }, 3.55);

    // "fake": the payee number is underlined in red
    ft("#mail-num", { backgroundSize: "0% 4px", color: "#111827" },
      { backgroundSize: "100% 4px", color: "#F04452", duration: 0.4, ease: "power2.out" }, 6.7);

    // S3: the agent reads; the camera pushes into the email body
    ft("#mail-cam", { x: 0, y: 0, scale: 1 }, { x: -1227, y: -205, scale: 1.62, duration: 0.8, ease: "expo.inOut" }, P + 0.3);
    ["#mail-l1", "#mail-l2", "#mail-l3", "#mail-l4", "#mail-l5"].forEach((id, i) => {
      const t = P + 1.3 + i * 1.15;
      ft(id, { backgroundColor: "rgba(113,56,255,0)" }, { backgroundColor: "rgba(113,56,255,0.16)", duration: 0.25, ease: "power2.out" }, t);
      ft(id, { backgroundColor: "rgba(113,56,255,0.16)" }, { backgroundColor: "rgba(113,56,255,0)", duration: 0.35, ease: "power2.in" }, t + 1.0);
    });
    // "attacker planted": the number lifts, everything else steps back
    ft("#mail-num", { scale: 1, backgroundColor: "rgba(240,68,82,0)" },
      { scale: 1.14, backgroundColor: "rgba(240,68,82,0.12)", duration: 0.3, ease: "power3.out" }, P + 8.65);
    ft(dim, { opacity: 1 }, { opacity: 0.35, duration: 0.4, ease: "power2.out" }, P + 9.2);

    // "Bangla or Banglish": pull back, the Bangla bill and the Banglish rent subject both show
    ft("#mail-cam", { x: -1227, y: -205, scale: 1.62 }, { x: 0, y: 0, scale: 1, duration: 0.9, ease: "expo.inOut" }, P + 11.0);
    ft(dim, { opacity: 0.35 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, P + 11.2);
    ft("#mail-row-rent", { backgroundColor: "rgba(113,56,255,0)" }, { backgroundColor: "rgba(113,56,255,0.14)", duration: 0.3, ease: "power2.out" }, P + 14.4);

    // the guardrail: Prompt Guard 2 flags none of the 24
    ft("#mail-guard", { x: 900 }, { x: 0, duration: 0.6, ease: "power3.out" }, P + 16.9);
    ft("#mail-zero", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "power4.out" }, P + 20.5);
    ft("#mail-of", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, P + 21.4);

    // T2: colour flood from the verdict card into the product world
    ft("#mail-flood", { clipPath: "circle(0% at 1470px 535px)" }, { clipPath: "circle(150% at 1470px 535px)", duration: 0.6, ease: "power2.inOut" }, 33.65);

    window.__timelines["mail"] = tl;
