  <script>
    const tl = gsap.timeline({ paused: true });
    // Only the first tween of a target+property sets its start state at load; later ones wait for their time
    // (fromTo renders its "from" immediately by default, which would show a later state on frame 0).
    const _seen = new Set();
    const ft = (t, from, to, pos) => {
      const keys = [].concat(t).flatMap(x => Object.keys(to).filter(k => !["duration", "ease"].includes(k)).map(k => x + ":" + k));
      if (keys.some(k => _seen.has(k))) to.immediateRender = false;
      keys.forEach(k => _seen.add(k));
      return tl.fromTo(t, from, to, pos);
    };
    // iris out of the Run button's violet onto the result
    ft("#demo-iris", { clipPath: "circle(150% at 50% 50%)" }, { clipPath: "circle(0% at 50% 50%)", duration: 0.4, ease: "power3.inOut" }, 0);
    ft("#demo-L", { x: -60, filter: "blur(8px)" }, { x: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, 0.15);
    ft("#demo-R", { x: 60, filter: "blur(8px)" }, { x: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, 0.22);

    // "paid the rent" -> "also paid the fake bill": the unprotected agent's two payments
    ft(["#demo-dimL", "#demo-dimR"], { opacity: 0 }, { opacity: 0.62, duration: 0.3, ease: "power2.out" }, 1.55);
    ft("#demo-lift-rent", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 1.6);
    ft("#demo-lift-rent", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power2.in" }, 3.55);
    ft("#demo-lift-fake", { opacity: 0, scale: 0.98 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out" }, 3.7);

    // "four and a half thousand taka": punch into the left column's Stolen figure
    ft("#demo-lift-fake", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power2.in" }, 4.95);
    ft("#demo-dimL", { opacity: 0.62 }, { opacity: 0, duration: 0.2, ease: "power2.out" }, 4.95);
    ft("#demo-cam", { x: 0, y: 0, scale: 1 }, { x: 355, y: 198, scale: 1.8, duration: 0.55, ease: "expo.inOut" }, 4.95);
    ft("#demo-cam", { x: 355, y: 198, scale: 1.8 }, { x: 0, y: 0, scale: 1, duration: 0.55, ease: "expo.inOut" }, 7.7);
    ft("#demo-dimL", { opacity: 0 }, { opacity: 0.62, duration: 0.3, ease: "power2.out" }, 8.4);

    // "With AgentShield ... blocked": the protected column's BLOCK step comes forward, the stamp lands on "blocked"
    ft("#demo-block", { scale: 0.62, x: 160, y: 300, opacity: 0 }, { scale: 1, x: 0, y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 9.2);
    ft("#demo-stamp", { scale: 1.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.2, ease: "power4.out" }, 11.5);
    ft("#demo-stamp", { x: -6 }, { x: 0, duration: 0.07, ease: "none" }, 11.7);
    // "reason in Bangla and English": push into the reason lines
    ft("#demo-cam", { x: 0, y: 0, scale: 1 }, { x: -1167, y: -243, scale: 1.55, duration: 0.6, ease: "expo.inOut" }, 13.9);
    ft("#demo-cam", { x: -1167, y: -243, scale: 1.55 }, { x: 0, y: 0, scale: 1, duration: 0.55, ease: "expo.inOut" }, 16.6);

    // "the landlord's real rent still goes through": the rent's ALLOW step joins it
    ft(["#demo-block", "#demo-stamp"], { x: 0 }, { x: -860, duration: 0.55, ease: "power2.inOut" }, 17.15);
    ft("#demo-rent", { x: 900, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 17.25);

    // payoff: everything collapses into one line, AgentShield saved the money
    ft("#demo-cam", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(10px)", duration: 0.45, ease: "power2.in" }, 19.55);
    ft("#demo-saved", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power4.out" }, 19.9);
    window.__timelines["demo"] = tl;
  </script>
