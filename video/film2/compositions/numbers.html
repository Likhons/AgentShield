  <script>
    const tl = gsap.timeline({ paused: true });
    const _seen = new Set();
    const ft = (t, from, to, pos) => {
      const keys = [].concat(t).flatMap(x => Object.keys(to).filter(k => !["duration", "ease"].includes(k)).map(k => x + ":" + k));
      if (keys.some(k => _seen.has(k))) to.immediateRender = false;
      keys.forEach(k => _seen.add(k));
      return tl.fromTo(t, from, to, pos);
    };
    const stamp = (id, at) => {
      ft(id, { scale: 1.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.22, ease: "power4.out" }, at);
      ft(id, { x: -7 }, { x: 0, duration: 0.07, ease: "none" }, at + 0.22);
    };
    // "Across twenty attacks and twenty real bills": the real table first
    ft("#nb-cap", { scale: 1.12, opacity: 0 }, { scale: 1.25, opacity: 1, duration: 0.5, ease: "power3.out" }, 0);
    ft("#nb-cap", { scale: 1.25, x: 0, y: 0 }, { scale: 1.32, x: -40, y: -20, duration: 1.7, ease: "power1.inOut" }, 0.5);
    // blur swap to the numbers themselves
    ft("#nb-cap", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(10px)", duration: 0.2, ease: "power2.in" }, 2.3);
    ft("#nb-board", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 2.45);
    ft(["#nb-kl", "#nb-kr"], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 2.5);
    // "four thefts without AgentShield"
    stamp("#nb-l1", 4.0);
    ft("#nb-cl1", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 4.4);
    // "None with it"
    stamp("#nb-l2", 6.48);
    ft("#nb-cl2", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 6.75);
    // "And the rent was paid exactly as often"
    stamp("#nb-r1", 7.45);
    ft("#nb-cr1", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 7.7);
    stamp("#nb-r2", 7.95);
    ft("#nb-cr2", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 8.2);
    ft("#nb-same", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 8.75);
    ft("#nb-foot", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 2.7);
    // dip to the second act
    ft("#nb-dip", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.in" }, 11.05);
    window.__timelines["numbers"] = tl;
