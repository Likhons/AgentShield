<template>
  <style>
    @font-face { font-family: "Bricolage"; src: url("assets/fonts/bricolage.woff2") format("woff2"); font-weight: 200 800; }
    @font-face { font-family: "Jakarta"; src: url("assets/fonts/jakarta.woff2") format("woff2"); font-weight: 200 800; }
    @font-face { font-family: "JBMono"; src: url("assets/fonts/jetbrains-mono.woff2") format("woff2"); font-weight: 100 800; }
    #root { position: absolute; inset: 0; overflow: hidden; background: #0A0B09; font-family: "Jakarta", sans-serif; color: #F4F2EA; }
    #hw-grid { position: absolute; inset: 0; background: radial-gradient(rgba(236,234,226,.06) 1px, transparent 1.4px) 0 0 / 24px 24px; }
    /* the real architecture map (captures at 2x, laid out at CSS size 1105 x 910); the board itself is the camera */
    #hw-board { position: absolute; left: 0; top: 0; width: 1105px; height: 910px; transform-origin: 0 0; }
    #hw-board img { position: absolute; left: 0; top: 0; width: 1105px; opacity: 0; }
    #hw-s0 { opacity: 1 !important; }
    .hw-scan { position: absolute; left: 503px; width: 306px; height: 72px; border-radius: 11px; overflow: hidden; opacity: 0; }
    .hw-scan i { position: absolute; top: 0; bottom: 0; width: 120px; left: -120px;
      background: linear-gradient(100deg, transparent, rgba(194,239,106,.28), transparent); }
    .hw-ring { position: absolute; border-radius: 12px; opacity: 0; }
    #hw-cover { position: absolute; left: 503.2px; top: 469.9px; width: 305.6px; height: 112.7px; border-radius: 12px; opacity: 0;
      background-image: url("assets/ui/arch_c2.png"); background-size: 1105px 910px; background-position: -503.2px -469.9px; }
    /* the call itself, carried from the email into the gateway */
    #hw-call { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 12px; padding: 12px 20px 12px 16px; border-radius: 999px;
      background: #171A15; box-shadow: 0 0 0 1.5px rgba(255,122,107,.75), 0 18px 40px rgba(0,0,0,.55); white-space: nowrap; opacity: 0;
      font-family: "JBMono", monospace; font-weight: 600; font-size: 30px; color: #F4F2EA; transform: translate(-50%, -50%); }
    #hw-call .dot { width: 12px; height: 12px; border-radius: 99px; background: #FF7A6B; }
    #hw-call .tag { color: #FF7A6B; font-size: 28px; }
    /* the decision clock: the real per-check times of the recorded call */
    #hw-clock { position: absolute; left: 1446px; top: 44px; width: 430px; padding: 22px 28px 24px; border-radius: 22px; background: #121410;
      box-shadow: 0 0 0 1px rgba(236,234,226,.14), 0 24px 50px rgba(0,0,0,.6); opacity: 0; transform-origin: 100% 0; }
    #hw-clock .k { font-weight: 600; font-size: 28px; color: #9C9C92; }
    #hw-clock .v { position: relative; margin-top: 6px; height: 92px; }
    #hw-ms, #hw-sec { position: absolute; left: 0; top: 0; font-family: "JBMono", monospace; font-weight: 700; font-size: 80px; letter-spacing: -0.03em;
      line-height: 1.1; white-space: nowrap; }
    #hw-sec { font-family: "Bricolage", sans-serif; font-weight: 800; font-size: 92px; letter-spacing: -0.04em; color: #C2EF6A; opacity: 0; line-height: 1; }
    #hw-clock .s { margin-top: 4px; font-weight: 500; font-size: 28px; color: #9C9C92; }
    #hw-iris { position: absolute; inset: 0; background: #C2EF6A; clip-path: circle(150% at 485px 431px); }
    #hw-out { position: absolute; inset: 0; background: #0A0B09; opacity: 0; }
  </style>
  <div id="root" data-composition-id="how" data-width="1920" data-height="1080">
    <div id="hw-grid"></div>
    <div id="hw-board">
      <img id="hw-s0" src="assets/ui/arch_inputs.png" alt="Architecture map: inputs reach the agent" />
      <img id="hw-s1" src="assets/ui/arch_call.png" alt="The gateway holds the call" />
      <img id="hw-s2" src="assets/ui/arch_c0.png" alt="Taint tracking: 0.90" />
      <img id="hw-s3" src="assets/ui/arch_c1.png" alt="Injection classifier: 0.30" />
      <img id="hw-s4" src="assets/ui/arch_c2.png" alt="Intent judge: 0.90" />
      <img id="hw-s5" src="assets/ui/arch_decide.png" alt="Policy: 0.95, decision BLOCK" />
      <img id="hw-s6" src="assets/ui/arch_out.png" alt="The call never runs" />
      <div id="hw-cover"></div>
      <div id="hw-scan0" class="hw-scan" style="top:156.6px"><i></i></div>
      <div id="hw-scan1" class="hw-scan" style="top:234.4px"><i></i></div>
      <div id="hw-scan2" class="hw-scan" style="top:312.2px"><i></i></div>
      <div id="hw-scan3" class="hw-scan" style="top:390.1px"><i></i></div>
      <div id="hw-rule" class="hw-ring" style="left:500px;top:387px;width:312px;height:78px;box-shadow:0 0 0 2px #FF7A6B"></div>
      <div id="hw-ring" class="hw-ring" style="left:499px;top:466px;width:314px;height:121px;box-shadow:0 0 0 2.5px #FF7A6B"></div>
    </div>
    <div id="hw-call"><span class="dot"></span>send_money → 01000000666<span class="tag">from email</span></div>
    <div id="hw-clock">
      <div class="k">Decision time</div>
      <div class="v"><div id="hw-ms">0.00 ms</div><div id="hw-sec">0.80 s</div></div>
      <div class="s">recorded run, real times</div>
    </div>
    <div id="hw-iris"></div>
    <div id="hw-out"></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const _seen = new Set();
    const ft = (t, from, to, pos) => {
      const keys = [].concat(t).flatMap(x => Object.keys(to).filter(k => !["duration", "ease"].includes(k)).map(k => x + ":" + k));
      if (keys.some(k => _seen.has(k))) to.immediateRender = false;
      keys.forEach(k => _seen.add(k));
      return tl.fromTo(t, from, to, pos);
    };
    // camera = the board's transform. wide: whole map; ROW(i): one check row at 2.9x; DEC: the decision strip
    const WIDE = { x: 341, y: 31, scale: 1.12 };
    const ROW = [-18.3, -243.9, -469.5, -695.4].map((y) => ({ x: -942.4, y, scale: 2.9 }));
    const cam = (from, to, at, d = 0.7) => ft("#hw-board", { ...from }, { ...to, duration: d, ease: "expo.inOut" }, at);
    const swap = (id, at) => ft(id, { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "none" }, at);
    const scan = (i, at, d) => {
      ft(`#hw-scan${i}`, { opacity: 0 }, { opacity: 1, duration: 0.1 }, at);
      ft(`#hw-scan${i} i`, { x: 0 }, { x: 430, duration: d, ease: "power1.inOut" }, at);
      ft(`#hw-scan${i}`, { opacity: 1 }, { opacity: 0, duration: 0.15 }, at + d);
    };
    // the clock is a pure function of timeline time (onUpdate runs on every seek)
    const clockEl = () => document.querySelector("#hw-ms");
    const fmt = (v) => (v < 10 ? v.toFixed(2) : v.toFixed(1)) + " ms";
    const clock = { v: 0 };
    const tick = (to, at, d, ease = "power2.out") => tl.to(clock, { v: to, duration: d, ease, onUpdate: () => { const e = clockEl(); if (e) e.textContent = fmt(clock.v); } }, at);

    tl.set("#hw-board", WIDE, 0);
    // T3 arrives as lime: the action dot opens onto the map, at the email it came from
    ft("#hw-iris", { clipPath: "circle(150% at 485px 431px)" }, { clipPath: "circle(0% at 485px 431px)", duration: 0.5, ease: "power3.inOut" }, 0);
    // "Every tool call stops here": the call travels email -> agent -> gateway, and is held
    ft("#hw-call", { left: 485, top: 431, opacity: 0, scale: 0.8 }, { left: 485, top: 431, opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 0.45);
    ft("#hw-call", { left: 485, top: 431 }, { left: 741, top: 431, duration: 0.55, ease: "power2.inOut" }, 0.75);
    ft("#hw-call", { left: 741, top: 431 }, { left: 1076, top: 118, duration: 0.6, ease: "power2.inOut" }, 1.35);
    swap("#hw-s1", 1.9);
    // the checks: the camera punches into each row as it is named; the row's real result appears on its answer
    ft("#hw-call", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power2.in" }, 3.3);
    ft("#hw-clock", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.4);
    cam(WIDE, ROW[0], 3.45);
    scan(0, 3.75, 1.2);                       // "Where did this number come from?"
    swap("#hw-s2", 5.24); tick(0.31, 5.24, 0.3);     // "An email, not you."   taint 0.90
    cam(ROW[0], ROW[1], 6.55);
    scan(1, 6.75, 1.9);                       // "Is the email giving the AI orders?"
    swap("#hw-s3", 9.09); tick(0.68, 9.09, 0.3);     // "No."  classifier 0.30
    cam(ROW[1], ROW[2], 11.15);
    scan(2, 11.5, 1.45);                      // "Did you ask for this payment?"  the judge runs
    tick(798.2, 11.5, 1.55, "power1.in");            // 797.5 ms for the LLM judge
    swap("#hw-s4", 13.05);                    // "The judge says no."  intent 0.90
    cam(ROW[2], ROW[3], 14.25);
    scan(3, 14.5, 0.45);                      // "Then a fixed rule settles it"
    swap("#hw-s5", 15.0); tick(798.4, 15.0, 0.25);   // policy 0.95 (the decision stays covered until "blocked")
    ft("#hw-cover", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 14.99);
    // "money to a stranger, found only in untrusted text": the rule that matched
    ft("#hw-rule", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 16.62);
    cam(ROW[3], { x: -1012, y: -760, scale: 3.0 }, 18.15, 1.2);
    ft("#hw-rule", { opacity: 1 }, { opacity: 0, duration: 0.2 }, 20.1);
    // "is blocked": pull back to the whole map; the decision lands and the call never runs
    cam({ x: -1012, y: -760, scale: 3.0 }, WIDE, 20.15, 0.75);
    ft("#hw-cover", { opacity: 1 }, { opacity: 0, duration: 0.12 }, 20.94);
    swap("#hw-s6", 20.94); tick(799.4, 20.94, 0.2);
    ft("#hw-ring", { opacity: 0, scale: 1.08, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.2, ease: "power4.out" }, 20.94);
    ft("#hw-board", { x: 335 }, { x: 341, duration: 0.08, ease: "none" }, 21.0);
    // "All of it in under a second"
    ft("#hw-clock", { scale: 1 }, { scale: 1.18, duration: 0.45, ease: "power3.out" }, 21.9);
    ft("#hw-ms", { opacity: 1 }, { opacity: 0, duration: 0.18 }, 22.05);
    ft("#hw-sec", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 22.1);
    // blur swap into the principle
    ft("#hw-out", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.in" }, 24.65);
    window.__timelines["how"] = tl;
  </script>
</template>
