<template>
  <style>

  <script>
    const tl = gsap.timeline({ paused: true });
    const _seen = new Set();
    const ft = (t, from, to, pos) => {
      const keys = [].concat(t).flatMap(x => Object.keys(to).filter(k => !["duration", "ease"].includes(k)).map(k => x + ":" + k));

      return tl.fromTo(t, from, to, pos);
    };
    // T4 whip in: the side-by-side lands blurred and sharpens
    ft("#po-view", { x: 520, y: 0, scale: 1, filter: "blur(16px)" }, { x: 0, y: 0, scale: 1, filter: "blur(0px)", duration: 0.3, ease: "power3.out" }, 0);

    // "The fake bill never runs": its BLOCK step comes forward
    ft("#po-dim", { opacity: 0 }, { opacity: 0.6, duration: 0.35, ease: "power2.out" }, 2.7);
    ft("#po-block", { x: 1180, y: 200, scale: 0.9, opacity: 0 }, { x: 1000, y: 168, scale: 1.3, opacity: 1, duration: 0.55, ease: "power3.out" }, 2.75);
    // "The real rent still goes through": the rent's ALLOW step beside it
    ft("#po-rent", { x: -120, y: 334, scale: 1.3, opacity: 0 }, { x: 80, y: 334, scale: 1.3, opacity: 1, duration: 0.55, ease: "power3.out" }, 4.92);

    ft("#po-rent", { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in" }, 7.0);
    ft("#po-block", { x: 1000, y: 168, scale: 1.3 }, { x: 120, y: -396, scale: 2.6, duration: 0.75, ease: "expo.inOut" }, 7.05);
    ft("#po-dim", { opacity: 0.6 }, { opacity: 0.92, duration: 0.4 }, 7.05);
    // payoff: the money stays. lime opens from the reason card; the amount lands like a stamp
    ft("#po-flood", { clipPath: "circle(0% at 1320px 540px)" }, { clipPath: "circle(160% at 1320px 540px)", duration: 0.55, ease: "power3.inOut" }, 9.55);
    ft("#po-pay", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 10.0);
    ft("#po-num", { scale: 1.35, opacity: 0, transformOrigin: "0% 80%" }, { scale: 1, opacity: 1, duration: 0.22, ease: "power4.out" }, 10.02);
    ft("#po-num", { x: -8 }, { x: 0, duration: 0.07, ease: "none" }, 10.24);
    ft("#po-saved", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 10.3);
    ft("#po-bn", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 10.75);
    ft("#po-src", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 11.0);
    window.__timelines["payoff"] = tl;
