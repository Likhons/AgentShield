# Render Blueprint: the AgentShield dashboard API (webapi/) for the React frontend.
# Render dashboard -> New -> Blueprint -> pick this repo. Steps and checks: docs/deploy.md, "React frontend".
# Render builds from the private GitHub repo, so dataset files are not published; only the API is public.
services:
  - type: web
    name: agentshield-api
    runtime: python
    plan: free            # sleeps after 15 min without requests; the next request waits ~1 min
    region: singapore     # closest Render region to Bangladesh
    branch: react-frontend
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn webapi.app:build_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.16
      - key: LLM_PROVIDER
        value: mock       # default for the raw gateway; the Playground picks Offline / Live / Recorded per run
      # Live (Groq) mode in the Playground: models as in the benchmark; the key is set in the Render dashboard
      # (Environment), never in this file. Without the key the Live button stays off.
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: JUDGE_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false       # value entered in the dashboard only
      - key: LIVE_RUNS_PER_HOUR
        value: "20"       # protects the free Groq quota: at most 20 live runs per hour, one at a time
      - key: AGENTSHIELD_API_KEY
        generateValue: true   # protects the raw gateway (/v1/*); the dashboard only uses /api/*
      # SHOW_ATTACK_TEXTS is deliberately not set: attacks.jsonl texts stay private (docs/ethics_impact.md).
